[project]
name = "langgraph-chatbot"
version = "0.1.0"
description = "A LangGraph-powered document intelligence assistant with web summarization support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.13.2",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.7",
    "langchain-openai>=1.1.7",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.7",
    "langgraph-checkpoint>=4.0.0",
    "langgraph-checkpoint-sqlite>=2.0.11",
    "mcp>=1.0.0",
    "pdf2image>=1.17.0",
    "pypdf>=6.7.0",
    "pytesseract>=0.3.13",
    "pyodbc>=5.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "sentence-transformers>=5.2.2",
    "streamlit>=1.53.1",
]

[project.scripts]
chatbot = "streamlit:main"
